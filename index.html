<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calcular Pallet</title>
    </head>
    <body>
        

    <div class="layout">
    <div class="container">
        <div class="section">
        <img src="Free download Ajinomoto logo.png" class="logo">
    <h3 class="h3">Selecione o tipo de pallet</h3>
    <select  id="tipoPallet">
        <option value="palletCHEP">CHEP</option>
        <option value="palletPBR">PBR</option>
        <option value="palletIMPORTADO">IMPORTADO</option>
        <option value="palletMADEIRA">MADEIRA</option>
    </select>

    <h3 class="h3" style="margin-top: 2.4rem;">Digite a quantidade</h3>
    <input type="number" id="quantidade">



    <button id="calcular">Calcular peso dos pallets</button>
    <p id="resultado"></p>

    
    <h3 class="h3" style="margin-top: 2.5rem;">Insira o peso da pesagem</h3>
    <input type="number" id="pesoPesagem">


    <button id="calcularTotal">Calcular Peso da pesagem</button>
    <p id="resultadoF"></p>
    </div>
    </div>
    </div>



    























    <script src="index.js"></script>


</body>
</html>

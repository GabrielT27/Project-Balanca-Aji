<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Pallet</title>
    </head>
    <body>
        
    

    <h3>Selecione o tipo de pallet</h3>
    <select  id="tipoPallet">
        <option value="palletCHEP">CHEP</option>
        <option value="palletPBR">PBR</option>
        <option value="palletIMPORTADO">IMPORTADO</option>
    </select>


    <h3>Digite a quantidade</h3>
    <input type="number" id="quantidade">

    <br><br>

    <button id="calcular">Calcular peso dos pallets</button>
    <p id="resultado"></p>


    


    <h3>Insira o peso da pesagem</h3>
    <input type="number" id="pesoPesagem">

    <br><br>

    <button id="calcularTotal">Calcular Peso da pesagem</button>

    
    <p id="resultadoF"></p>



    

    <script src="index.js"></script>


</body>
</html>
